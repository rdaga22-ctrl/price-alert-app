name: Market alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 0-5,7-23 * * *'
    - cron: '37 6 * * *'

permissions:
  contents: write

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Load current project files
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Find new alerts
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python3 run_alerts.py prepare

      - name: Save the alert record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alert-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Save market alert progress"
            git push origin HEAD:main
          fi

      - name: Send new alerts to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run_alerts.py deliver

      - name: Send noon scan confirmation
        if: ${{ success() && github.event_name == 'schedule' && github.event.schedule == '37 6 * * *' && github.run_attempt == 1 }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error --max-time 20 --output /dev/null \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=Price Alert daily check: the scheduled noon scan finished successfully." \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
