name: Check price feed

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check all seven markets
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import urlopen

          symbols = ("EUR/USD", "USD/JPY", "AUD/USD", "GBP/USD",
                     "USD/CAD", "EUR/GBP", "XAU/USD")
          key = os.environ.get("TWELVE_DATA_API_KEY")
          if not key:
              raise SystemExit("GitHub could not find the Twelve Data secret.")

          query = urlencode({
              "symbol": ",".join(symbols),
              "interval": "5min",
              "outputsize": 1,
              "timezone": "Asia/Kolkata",
              "apikey": key,
          })
          try:
              with urlopen("https://api.twelvedata.com/time_series?" + query,
                           timeout=20) as response:
                  data = json.load(response)
          except (OSError, ValueError):
              raise SystemExit("Could not read a response from Twelve Data.") from None

          failures = 0
          for symbol in symbols:
              result = data.get(symbol, {})
              candles = result.get("values", [])
              if result.get("status") == "ok" and candles and candles[0].get("datetime"):
                  print(f"{symbol} OK — {candles[0]['datetime']} India time")
              else:
                  code = result.get("code", data.get("code"))
                  detail = f" (code {code})" if isinstance(code, int) else ""
                  print(f"{symbol} — no candle returned{detail}")
                  failures += 1
          raise SystemExit(1 if failures else 0)
          PY
      - name: Send feed status to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id.isdecimal():
              raise SystemExit("Check the Telegram bot token and chat ID in GitHub secrets.")

          request = Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({
                  "chat_id": int(chat_id),
                  "text": "Price Alert setup test: GitHub fetched 5-minute candles for all seven markets.",
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urlopen(request, timeout=20) as response:
                  result = json.load(response)
          except (OSError, ValueError):
              raise SystemExit("Telegram could not send the setup message.") from None
          if not result.get("ok"):
              raise SystemExit("Telegram rejected the setup message.")
          print("Setup message sent to Telegram.")
          PY
